<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        :root {
            --bg-from: #ecebff;
            --bg-to: #f1edff;
            --card-bg: #ffffff;
            --text: #1c1836;
            --text-muted: #8a86a8;
            --border: #e8e6f9;
            --accent: #3e20e0;
            --accent-hover: #2f16bd;
            --accent-soft: #ece7fd;
            --danger: #e5484d;
            --danger-soft: #fdeceb;
            --warning: #b45a00;
            --warning-soft: #fdf1de;
            --shadow: 0 20px 40px -20px rgba(62, 32, 224, .3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-from: #120f24;
                --bg-to: #191033;
                --card-bg: #1e1a38;
                --text: #f1eefc;
                --text-muted: #8f8aac;
                --border: #322b52;
                --accent: #8272ff;
                --accent-hover: #9989ff;
                --accent-soft: #2a2150;
                --danger: #ff6b70;
                --danger-soft: #3a2130;
                --warning: #f5b25c;
                --warning-soft: #3a2c14;
                --shadow: 0 20px 40px -20px rgba(0, 0, 0, .6);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 3rem 1rem;
            color: var(--text);
            background: radial-gradient(circle at 20% 0%, var(--bg-from), var(--bg-to) 65%);
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 30rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        h1 {
            margin: 0 0 .35rem;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: .9rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        form {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: .25rem;
        }

        .tabs {
            display: flex;
            gap: .4rem;
            overflow-x: auto;
            padding-bottom: .9rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            scrollbar-width: thin;
        }

        .tab {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            padding: .4rem .8rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--text-muted);
            font-size: .85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }

        .tab:hover { color: var(--accent); border-color: var(--accent); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .tab.add { border-style: dashed; }

        .tab .count {
            font-size: .7rem;
            padding: 0 .4rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .tab.active .count { background: rgba(255, 255, 255, .25); color: #fff; }

        .category-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -.4rem 0 .8rem;
            font-size: .8rem;
            color: var(--text-muted);
        }

        .category-bar[hidden] { display: none; }
        .category-bar .icon-btn { width: 1.7rem; height: 1.7rem; font-size: .8rem; }

        input[type="text"], input[type="search"], input[type="datetime-local"], select {
            flex: 1 1 10rem;
            padding: .7rem .9rem;
            border: 1px solid var(--border);
            border-radius: .7rem;
            background: transparent;
            color: var(--text);
            font-size: .95rem;
            font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }

        input[type="datetime-local"] { flex: 1 1 12rem; color-scheme: light; }
        @media (prefers-color-scheme: dark) { input[type="datetime-local"] { color-scheme: dark; } }

        input[type="text"]::placeholder, input[type="search"]::placeholder { color: var(--text-muted); }

        #search { display: block; width: 100%; margin-top: 1rem; }

        select { flex: 1 1 8rem; cursor: pointer; }
        select option { background: var(--card-bg); color: var(--text); }

        input[type="text"]:focus, input[type="search"]:focus, input[type="datetime-local"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        form button {
            flex: 1 1 100%;
            padding: .7rem 1.1rem;
            border: none;
            border-radius: .7rem;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: .95rem;
            cursor: pointer;
            transition: background .15s, transform .1s;
        }

        form button:hover { background: var(--accent-hover); }
        form button:active { transform: scale(.98); }

        #error {
            color: var(--danger);
            background: var(--danger-soft);
            border-radius: .6rem;
            padding: .6rem .8rem;
            font-size: .85rem;
            margin: .9rem 0 0;
        }

        #empty {
            text-align: center;
            color: var(--text-muted);
            font-size: .9rem;
            padding: 2rem 0 .5rem;
        }

        ul {
            list-style: none;
            margin: 1rem 0 0;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: .65rem .25rem;
            border-bottom: 1px solid var(--border);
            animation: fade-in .15s ease-out;
        }

        li:last-child { border-bottom: none; }

        li.group {                                   /* 숨김 탭의 분류 묶음 제목 */
            padding: .9rem .25rem .3rem;
            font-size: .75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        li.group:first-child { padding-top: 0; }

        .list-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: .75rem;
            padding-top: .75rem;
            border-top: 1px solid var(--border);
        }

        .list-footer[hidden] { display: none; }

        .text-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: .8rem;
            font-weight: 600;
            font-family: inherit;
            padding: .35rem .6rem;
            border-radius: .5rem;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .text-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="checkbox"] {
            appearance: none;
            width: 1.2rem;
            height: 1.2rem;
            flex-shrink: 0;
            border: 1.5px solid var(--border);
            border-radius: .4rem;
            cursor: pointer;
            position: relative;
            transition: background .15s, border-color .15s;
        }

        input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: .35rem;
            top: .12rem;
            width: .3rem;
            height: .6rem;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .todo-text {
            flex: 1;
            min-width: 0;
            font-size: .95rem;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .todo-text .desc {
            display: block;
            color: var(--text-muted);
            font-size: .8rem;
        }

        .todo-text .due {
            display: inline-block;
            margin-top: .3rem;
            font-size: .75rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            padding: .1rem .5rem;
            border-radius: .4rem;
        }

        .todo-text .category {
            display: inline-block;
            margin: .3rem .3rem 0 0;
            font-size: .75rem;
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: .05rem .5rem;
            border-radius: .4rem;
        }

        .todo-text .due.overdue { color: var(--danger); background: var(--danger-soft); }
        .todo-text .due.soon { color: var(--warning); background: var(--warning-soft); }

        .done .title { text-decoration: line-through; color: var(--text-muted); }
        .done .desc { text-decoration: line-through; }
        .done .due { text-decoration: line-through; }

        .icon-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            width: 2rem;
            height: 2rem;
            border-radius: .5rem;
            cursor: pointer;
            font-size: .95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
        }

        .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
        .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>📝 To-Do List</h1>
            <p id="subtitle">오늘 할 일을 정리해보세요</p>
        </header>
        <div class="card">
            <nav class="tabs" id="tabs" aria-label="분류"></nav>
            <div class="category-bar" id="category-bar" hidden>
                <span id="category-name"></span>
                <span>
                    <button type="button" class="icon-btn" id="rename-category" title="분류 이름 변경">✏️</button>
                    <button type="button" class="icon-btn danger" id="delete-category" title="분류 삭제">🗑️</button>
                </span>
            </div>
            <form id="todo-form">
                <input type="text" id="title" placeholder="제목 (예: 과제)" required>
                <input type="text" id="description" placeholder="설명 (예: DevOps)">
                <input type="datetime-local" id="due-date" aria-label="마감일">
                <select id="category" aria-label="분류"></select>
                <button type="submit">+ 할 일 추가</button>
            </form>
            <p id="error" role="alert" hidden></p>
            <input type="search" id="search" placeholder="🔍 제목·설명 검색" aria-label="검색">
            <ul id="todo-list"></ul>
            <p id="empty" hidden>아직 할 일이 없어요. 위에서 추가해보세요 ✨</p>
            <div class="list-footer" id="list-footer" hidden>
                <button type="button" class="text-btn danger" id="clear-completed"></button>
            </div>
        </div>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), emptyEl = $("empty"), subtitleEl = $("subtitle");
        const tabsEl = $("tabs"), categorySelectEl = $("category");

        // 선택된 분류: "all" (전체) | "none" (미분류) | "hidden" (숨김) | 분류 id
        let state = { todos: [], categories: [], selected: "all", query: "" };

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => {
          const [todos, categories] = await Promise.all([api("/todos"), api("/categories")]);
          state = { ...state, todos, categories };
          if (typeof state.selected === "number" && !categories.some((c) => c.id === state.selected)) {
            state.selected = "all";                      // 지워진 분류를 보고 있었다면 전체로
          }
          if (state.selected === "hidden" && !todos.some((t) => t.hidden)) {
            state.selected = "all";                      // 숨긴 항목이 다 사라졌다면 전체로
          }
          render();
        });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        const SOON_THRESHOLD_MS = 3 * 24 * 60 * 60 * 1000; // 3일 이내는 임박으로 표시

        function formatDue(dueDate) {
          const d = new Date(dueDate);
          const pad = (n) => String(n).padStart(2, "0");
          return `~${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} 마감`;
        }

        function dueStatus(dueDate) {
          const diff = new Date(dueDate) - new Date();
          if (diff < 0) return "overdue";
          if (diff <= SOON_THRESHOLD_MS) return "soon";
          return "";
        }

        function iconButton(icon, label, extraClass, onclick) {
          return Object.assign(document.createElement("button"), {
            type: "button",
            textContent: icon,
            title: label,
            className: `icon-btn${extraClass ? " " + extraClass : ""}`,
            onclick,
          });
        }

        const categoryName = (id) => state.categories.find((c) => c.id === id)?.name;

        function matches(todo, selected) {
          if (selected === "hidden") return todo.hidden;
          if (todo.hidden) return false;                 // 숨긴 항목은 숨김 탭에서만 보인다
          if (selected === "all") return true;
          if (selected === "none") return todo.category_id === null;
          return todo.category_id === selected;
        }

        function tab(label, key, extraClass = "") {
          const remaining = state.todos.filter((t) => matches(t, key) && !t.completed).length;
          const btn = Object.assign(document.createElement("button"), {
            type: "button",
            className: `tab${state.selected === key ? " active" : ""}${extraClass ? " " + extraClass : ""}`,
            textContent: label,
            onclick: () => { state.selected = key; render(); },
          });
          if (remaining) btn.append(Object.assign(document.createElement("span"), { className: "count", textContent: remaining }));
          return btn;
        }

        function renderCategories() {
          const addBtn = Object.assign(document.createElement("button"), {
            type: "button", className: "tab add", textContent: "+ 분류", title: "분류 추가", onclick: addCategory,
          });
          tabsEl.replaceChildren(
            tab("전체", "all"),
            ...state.categories.map((c) => tab(c.name, c.id)),
            ...(state.categories.length ? [tab("미분류", "none")] : []),
            ...(state.todos.some((t) => t.hidden) ? [tab("🙈 숨김", "hidden")] : []),
            addBtn,
          );

          const current = typeof state.selected === "number" ? categoryName(state.selected) : null;
          $("category-bar").hidden = !current;
          $("category-name").textContent = current ? `📁 ${current}` : "";

          // 추가 폼의 분류 선택 — 기본값은 지금 보고 있는 분류
          categorySelectEl.replaceChildren(
            new Option("미분류", ""),
            ...state.categories.map((c) => new Option(c.name, c.id)),
          );
          categorySelectEl.hidden = state.categories.length === 0;
          categorySelectEl.value = typeof state.selected === "number" ? state.selected : "";
        }

        // 검색어가 제목이나 설명에 들어 있는지 (대소문자 무시)
        function searched(todo) {
          const keyword = state.query.trim().toLowerCase();
          return `${todo.title}\n${todo.description}`.toLowerCase().includes(keyword);
        }

        // 숨김 탭: 분류 순서대로 묶고, 미분류는 맨 뒤에
        function groupByCategory(todos) {
          const groups = [...state.categories.map((c) => c.id), null]
            .map((id) => [id, todos.filter((t) => t.category_id === id)])
            .filter(([, items]) => items.length);
          return groups.flatMap(([id, items]) => [
            Object.assign(document.createElement("li"), {
              className: "group",
              textContent: `📁 ${id === null ? "미분류" : categoryName(id)} · ${items.length}`,
            }),
            ...items.map(todoItem),
          ]);
        }

        function render() {
          renderCategories();
          const hiddenView = state.selected === "hidden";
          const inTab = state.todos.filter((t) => matches(t, state.selected));
          const todos = inTab.filter(searched);
          emptyEl.hidden = todos.length !== 0;
          emptyEl.textContent = state.query.trim() ? "검색 결과가 없어요 🔍"
            : state.selected === "all" ? "아직 할 일이 없어요. 위에서 추가해보세요 ✨"
            : "이 분류에는 할 일이 없어요 ✨";
          subtitleEl.textContent = inTab.length
            ? `${inTab.filter((t) => t.completed).length} / ${inTab.length}개 완료`
            : "오늘 할 일을 정리해보세요";

          // 완료 항목 일괄 삭제 — 숨김 탭에서는 숨긴 것만, 그 외에는 보이는 것만 (모든 분류)
          const doneCount = state.todos.filter((t) => t.completed && t.hidden === hiddenView).length;
          $("list-footer").hidden = doneCount === 0;
          $("clear-completed").textContent = `🧹 완료된 ${hiddenView ? "숨긴 " : ""}항목 ${doneCount}개 모두 지우기`;

          listEl.replaceChildren(...(hiddenView ? groupByCategory(todos) : todos.map(todoItem)));
        }

        function todoItem(todo) {
          const check = Object.assign(document.createElement("input"), {
            type: "checkbox",
            checked: todo.completed,
            onchange: () => save(todo.id, { ...todo, completed: check.checked }),
          });

          const title = Object.assign(document.createElement("span"), { className: "title", textContent: todo.title });
          const text = document.createElement("span");
          text.className = "todo-text";
          text.append(title);
          if (todo.description) {
            text.append(Object.assign(document.createElement("span"), { className: "desc", textContent: todo.description }));
          }
          if (state.selected === "all" && todo.category_id !== null) {
            text.append(Object.assign(document.createElement("span"), { className: "category", textContent: `📁 ${categoryName(todo.category_id)}` }));
          }
          if (todo.due_date) {
            const status = todo.completed ? "" : dueStatus(todo.due_date);
            text.append(Object.assign(document.createElement("span"), {
              className: `due${status ? ` ${status}` : ""}`,
              textContent: formatDue(todo.due_date),
            }));
          }

          const li = document.createElement("li");
          li.className = todo.completed ? "done" : "";
          li.append(
            check,
            text,
            iconButton("✏️", "수정", "", () => edit(todo)),
            todo.hidden
              ? iconButton("👁️", "다시 보이기", "", () => save(todo.id, { ...todo, hidden: false }))
              : iconButton("🙈", "숨기기", "", () => save(todo.id, { ...todo, hidden: true })),
            iconButton("🗑️", "삭제", "danger", () => remove(todo.id)),
          );
          return li;
        }

        function edit(todo) {
          const title = prompt("새 제목:", todo.title);
          if (title === null) return;
          const description = prompt("새 설명:", todo.description);
          if (description === null) return;
          const dueDate = prompt("새 마감일 (YYYY-MM-DD HH:mm, 없으면 비워두기):", todo.due_date ? todo.due_date.slice(0, 16).replace("T", " ") : "");
          if (dueDate === null) return;
          let categoryId = todo.category_id;
          if (state.categories.length) {
            const names = state.categories.map((c) => c.name).join(", ");
            const name = prompt(`분류 (${names} 중 하나, 비우면 미분류):`, categoryName(todo.category_id) ?? "");
            if (name === null) return;
            const found = state.categories.find((c) => c.name === name.trim());
            if (name.trim() && !found) { alert(`"${name.trim()}" 분류가 없어요.`); return; }
            categoryId = found ? found.id : null;
          }
          save(todo.id, { ...todo, title: title.trim(), description: description.trim(), due_date: dueDate.trim().replace(" ", "T") || null, category_id: categoryId });
        }

        function addCategory() {
          const name = prompt("새 분류 이름:");
          if (!name?.trim()) return;
          run("분류 추가", async () => {
            const category = await api("/categories", "POST", { name: name.trim() });
            state.selected = category.id;
            await load();
          });
        }

        $("rename-category").onclick = () => {
          const id = state.selected;
          const name = prompt("분류 이름 변경:", categoryName(id));
          if (!name?.trim()) return;
          run("분류 이름 변경", async () => { await api(`/categories/${id}`, "PUT", { name: name.trim() }); await load(); });
        };

        $("delete-category").onclick = () => {
          const id = state.selected;
          if (!confirm(`"${categoryName(id)}" 분류를 삭제할까요? 속한 할 일은 미분류로 옮겨져요.`)) return;
          run("분류 삭제", async () => { await api(`/categories/${id}`, "DELETE"); await load(); });
        };

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        $("search").oninput = (event) => { state.query = event.target.value; render(); };

        $("clear-completed").onclick = () => {
          const hidden = state.selected === "hidden";
          if (!confirm(`완료된 ${hidden ? "숨긴 " : ""}항목을 모든 분류에서 지울까요?`)) return;
          run("완료 항목 삭제", async () => { await api(`/todos/completed?hidden=${hidden}`, "DELETE"); await load(); });
        };

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          run("추가", async () => {
            await api("/todos", "POST", {
              title: $("title").value.trim(),
              description: $("description").value.trim(),
              due_date: $("due-date").value || null,
              category_id: categorySelectEl.value ? Number(categorySelectEl.value) : null,
            });
            event.target.reset();
            await load();
          });
        };

        load();
    </script>
</body>
</html>
