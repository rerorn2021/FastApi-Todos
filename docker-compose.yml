services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app-heon
    ports:
      - "5041:8000"
    volumes:
      - todo-data:/app/data       # 할 일 데이터 보존 (컨테이너를 지워도 남음)
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거

volumes:
  todo-data:
    name: todo-data               # 이름 고정 — Jenkins 배포(-v todo-data:/app/data)와 같은 볼륨을 쓴다
